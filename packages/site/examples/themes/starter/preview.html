<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starter theme preview</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 36rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
        color: #f0eef8;
        background: #0b0a12;
      }
      code, pre { background: #161422; }
      code { padding: 0.1em 0.35em; }
      pre { padding: 0.75rem 1rem; overflow: auto; }
      a { color: #a78bfa; }
    </style>
  </head>
  <body>
    <h1>Starter theme — standalone preview</h1>
    <p>From this folder (Deno required):</p>
    <pre>deno task preview:open
deno task studio
deno task pack</pre>
    <p>
      First run may download the <code>@ursamu/site</code> shell into
      <code>.preview-shell/</code>. Studio may cache into
      <code>.theme-studio/</code>.
    </p>
  </body>
</html>
